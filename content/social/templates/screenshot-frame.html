<!doctype html>
<meta charset="utf-8">
<title>screenshot-frame</title>
<!--
  screenshot-frame — a supplied product screenshot inside a phone frame.

  The frame is drawn from tokens (surface, rule, radius, shadow) and carries no
  colour of its own. The screenshot is inlined as a data: URI by render.mjs, so
  the page never fetches anything while it is being photographed.

  The mark defaults to shown (opt out with "mark": false in post.json).

  Slots: eyebrow · headline · caption · footer   Image: image
-->
<link rel="stylesheet" href="./_base.css">
<style>
  /* Frame geometry only — every colour below is a design-system token.

     The whole chain shrinks: .shot-wrap takes the leftover column height, and
     every box inside it is allowed to shrink to fit (min-height: 0 defeats the
     flex default of min-height: auto, which is what lets a tall screenshot push
     out of its parent and sit on top of the headline). Without this the frame
     silently overlaps the copy — and the picture still "renders fine". */
  .shot-wrap {
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
    align-items: stretch;      /* the frame's height IS the leftover column */
    justify-content: center;
  }
  .device {
    display: flex;
    min-width: 0;
    max-width: 100%;
    padding: var(--space-3);
    background: var(--surface-4);
    border-radius: calc(var(--radius-lg) * 2.4);
    box-shadow: var(--shadow-3);
  }
  /* The screen carries the SCREENSHOT'S OWN aspect ratio, which render.mjs
     measures from the file and sets as --shot-ratio. Sizing the frame from the
     ratio (rather than letting the image shrink inside a frame that had already
     sized itself to the image's intrinsic width) is what keeps the frame tight:
     otherwise the screen keeps its original width and the difference shows as a
     band of bare --surface-0 down one side. height:100% with max-width:100%
     covers both orientations — whichever axis runs out first clamps, and the
     ratio recomputes the other. */
  .device__screen {
    aspect-ratio: var(--shot-ratio, 3 / 4);
    height: 100%;
    width: auto;
    max-width: 100%;
    border-radius: calc(var(--radius-lg) * 1.9);
    overflow: hidden;
    background: var(--surface-0);
    border: var(--space-1) solid var(--surface-3);
  }
  .device__screen img { display: block; width: 100%; height: 100%; }
</style>
<body>
  <article class="slide" data-slot-attr-surface>
    <div class="stack">
      <span class="eyebrow" data-slot="eyebrow"></span>
      <h2 class="headline headline--sm" data-slot="headline"></h2>
    </div>

    <div class="spacer"></div>

    <div class="shot-wrap">
      <div class="device">
        <div class="device__screen"><img data-slot-src="image" alt=""></div>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="stack">
      <p class="body" data-slot="caption"></p>
      <div class="foot-row">
        <span class="footer" data-slot="footer"></span>
        <img class="mark" data-slot-src="mark" alt="">
      </div>
    </div>
  </article>
</body>
